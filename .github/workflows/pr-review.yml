name: PostHog Watcher PR review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  pull_request_review_comment:
    types: [created]

# Review-comment payloads also carry pull_request, so keying on the PR number
# alone would let any comment cancel an in-flight review. Push-triggered runs
# share one group per PR (a new push supersedes the stale review); each comment
# run gets its own group and never cancels anything.
concurrency:
  group: posthog-watcher-pr-review-${{ github.event.pull_request.number }}-${{ github.event.comment.id || 'review' }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  pr-review:
    name: PR review
    runs-on: ubuntu-latest
    # Fork PRs cannot read repository secrets, and pr-review skips forks anyway,
    # so only run when the head branch lives in this repository.
    if: github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Install pi search tools
        run: |
          sudo apt-get update
          sudo apt-get install -y fd-find ripgrep
          sudo ln -sf "$(which fdfind)" /usr/local/bin/fd

      - name: Review pull request
        uses: ./
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          mode: pr-review
          allow-pr-review: 'true'
