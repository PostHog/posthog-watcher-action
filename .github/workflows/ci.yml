name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup environment
        uses: ./.github/actions/setup

      - name: Lint
        run: pnpm lint

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup environment
        uses: ./.github/actions/setup
        with:
          # The test glob includes the smoke tests, which boot dist/; build so
          # they run against the PR's source instead of the committed bundle.
          build: 'true'

      - name: Test
        run: pnpm test

  action-smoke-test:
    name: Action smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup environment
        uses: ./.github/actions/setup
        with:
          build: 'true'

      - name: Smoke test bundled action
        run: node --test test/action-smoke.test.mjs

  dist-unchanged:
    name: Dist unchanged
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Check dist is untouched
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          if ! git diff --quiet "origin/${BASE_REF}...HEAD" -- dist; then
            echo "::error::Pull requests must not modify dist/ — it is rebuilt and committed on main by the Sync dist workflow."
            git diff --stat "origin/${BASE_REF}...HEAD" -- dist
            exit 1
          fi
          echo "dist untouched"
